plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

def forgeMcVer      = project.forge_mc_version
def forgeVer        = project.forge_version
def forgeMappingVer = project.forge_mapping_version
def helpSystemVer   = "v1"

base {
    archivesName = "${project.archives_base_name}+forge+${forgeMcVer}"
}

version = project.forge_mod_version
group = project.maven_group

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: project.mapping_channel, version: forgeMappingVer

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                ontime {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', 'ontime'
        }

        server {
            property 'forge.enabledGameTestNamespaces', 'ontime'
            args '--nogui'
        }
    }
}

sourceSets {
    main {
        java {
            // Forge 1.20.1 has no separate client source set, so the shared
            // client sources join main here rather than a client one.
            srcDirs = [
                    'src/main/java',
                    'src/client/java',
                    '../common/src/main/java',
                    '../common/src/client/java',
                    "../common/src/${helpSystemVer}/java"
            ]
        }
        resources {
            srcDirs = [
                    'src/main/resources',
                    'src/client/resources'
            ]
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${forgeMcVer}-${forgeVer}"
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
}

mixin {
    add sourceSets.main, "mixins.ontime.refmap.json"
    config "ontime.client.mixins.json"
    debug.verbose = true
    debug.export = true
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

def requireOr(String key) {
    def value = project.findProperty(key)
    if (!value) throw new GradleException("gradle.properties is missing '${key}'")
    return value
}

def minecraftRange = requireOr("mc_range_forge_v1_20_1")
def forgeRange     = requireOr("forge_range")

processResources {
    from('../common/src/main/resources') {
        // The web panel's page ships inside the jar and is read from there at
        // runtime. Only 'assets/**' came across, so the NeoForge jar answered
        // "Panel resources missing from the jar" to anyone who opened it --
        // the Fabric one carried them because it compiles common's resources
        // in wholesale.
        include 'assets/**'
        include 'webpanel/**'
        exclude 'META-INF/**'
        exclude 'fabric.mod.json'
    }

    inputs.property "version", forge_mod_version
    inputs.property "minecraft_range", minecraftRange
    inputs.property "forge_range", forgeRange
    filesMatching("META-INF/mods.toml") {
        expand 'version': forge_mod_version, 'minecraft_range': minecraftRange,
                'forge_range': forgeRange
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Forge 1.20.1 is the last version whose classes are SRG-named at runtime,
// so the refmap is the only way Mixin can tell that 'render' means
// 'm_280652_'. MixinGradle does put it in the jar -- but the annotation
// processor writes it into a temp directory Gradle does not know is an
// output of compileJava. Restore that task from the build cache, which is
// exactly what happened when 5.0.0 was built, and the file is simply never
// created: MixinGradle skips it without a word and the jar ships unable to
// translate a single target. Declaring it as an output makes the cache
// carry it like any other compiled result.
// Fabric needs no equivalent -- Loom rewrites the mixin at build time -- and
// neither does NeoForge on 1.21+, which runs on Mojang names.
def refMapFile = layout.buildDirectory.file("tmp/compileJava/mixins.ontime.refmap.json")

tasks.named('compileJava') {
    outputs.file(refMapFile)
}

// A silent omission is what let a crashing jar reach two platforms, so the
// build now refuses to call itself finished without looking inside.
def verifyRefMap = tasks.register('verifyRefMap') {
    // reobfJar, not jar: reobfuscation rewrites the archive in place after
    // jar has produced it, and checking in between reads a file that is not
    // the one that ships.
    dependsOn tasks.named('reobfJar')
    doLast {
        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        def entry = new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.getEntry('mixins.ontime.refmap.json')?.with { zip.getInputStream(it).text }
        }
        if (entry == null) {
            throw new GradleException("verifyRefMap: ${jarFile.name} has no " +
                    "mixins.ontime.refmap.json. Forge 1.20.1 needs it to resolve " +
                    "every mixin target; without it the game crashes on startup.")
        }
        if (!entry.contains('m_280652_')) {
            throw new GradleException("verifyRefMap: the refmap in ${jarFile.name} " +
                    "does not map BossHealthOverlay.render. It was built without " +
                    "SRG mappings and will not apply at runtime.")
        }
        logger.lifecycle("verifyRefMap: ${jarFile.name} carries a refmap that maps render ok")
    }
}
tasks.named('check') { dependsOn verifyRefMap }

// Reobfuscation matches by name and descriptor, not by which mod owns the
// class. Give a method of ours the exact signature of one of vanilla's --
// PanelHost.clearWidgets()V against Screen.clearWidgets()V -- and the call
// sites are rewritten to the SRG name while the declaration keeps its own.
// Nothing warns; the jar builds; the screen opens with no buttons on it and
// the game dies on the first resize. Any reference to one of this mod's own
// classes under an SRG name is that mistake, so the finished jar is read for
// them rather than trusted.
def verifyNoSrgOnOwnClasses = tasks.register('verifyNoSrgOnOwnClasses') {
    // Only reobfuscation can introduce this fault, so the check has to come
    // after it -- and 'check' alone does not build the jar, hence assemble.
    dependsOn tasks.named('reobfJar')
    doLast {
        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        def classes = []
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().each { entry ->
                if (entry.name.startsWith('com/mateof24/') && entry.name.endsWith('.class')) {
                    classes << entry.name[0..-7].replace('/', '.')
                }
            }
        }
        def output = new ByteArrayOutputStream()
        exec {
            commandLine(["${System.getProperty('java.home')}/bin/javap", '-c', '-p',
                         '-cp', jarFile.absolutePath] + classes)
            standardOutput = output
            errorOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
        }
        def offenders = (output.toString('UTF-8') =~
                /(?:Method|InterfaceMethod|Field) (com\/mateof24\/[A-Za-z0-9\/\$]+\.(?:m_[0-9_]+|f_[0-9_]+))/)
                .collect { it[1] } as SortedSet
        if (offenders) {
            throw new GradleException("verifyNoSrgOnOwnClasses: ${jarFile.name} refers to this " +
                    "mod's own members under SRG names, which cannot resolve at runtime:\n  " +
                    offenders.join("\n  ") +
                    "\nRename them: a method of ours must not share a name and " +
                    "descriptor with one of vanilla's.")
        }
        logger.lifecycle("verifyNoSrgOnOwnClasses: ${classes.size()} classes, none mangled")
    }
}
tasks.named('check') { dependsOn verifyNoSrgOnOwnClasses }

jar {
    manifest {
        attributes([
                'Specification-Title'  : mod_name,
                'Specification-Vendor' : 'MateoF24',
                'Specification-Version': '1',
                'Implementation-Title' : mod_name,
                'Implementation-Version': forge_mod_version,
                'Implementation-Vendor': 'MateoF24',
                'MixinConfigs'         : 'ontime.client.mixins.json'
        ])
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
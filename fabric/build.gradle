plugins {
    id 'fabric-loom' version '1.13-SNAPSHOT'
}

def minecraftVer = project.minecraft_version

// One family on this branch. The fork that used to be here chose between four
// of them, three of which are built from 'main'.
String versionType = "v1.20.1"
def helpSystemVer  = "v1"

def vKey = versionType.replace('.', '_')

def fabricApiVer      = project.findProperty("fabric_api_${vKey}")
def clothVer          = project.findProperty("cloth_${vKey}")
def modmenuVer        = project.findProperty("modmenu_${vKey}")
def placeholderApiVer = project.findProperty("placeholder_api_${vKey}")

base {
    archivesName = "${project.archives_base_name}+fabric+${minecraftVer}"
}

version = project.mod_version
group = project.maven_group

loom {
    splitEnvironmentSourceSets()

    mods {
        ontime {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

sourceSets {
    main {
        java {
            srcDirs = [
                    'src/main/java',
                    '../common/src/main/java',
                    "../common/src/${helpSystemVer}/java",
                    "src/${versionType}/main/java"
            ]
        }
        resources {
            srcDirs = [
                    "src/${versionType}/main/resources",
                    'src/main/resources',
                    '../common/src/main/resources'

            ]
        }
    }

    client {
        java {
            // Where every client class will live once F6 moves it out of
            // the loaders, exactly as it sits on 'main'.
            srcDirs = [
                    'src/client/java',
                    '../common/src/client/java',
                    "src/${versionType}/client/java"
            ]
        }
        resources {
            srcDirs = [
                    "src/${versionType}/client/resources",
                    'src/client/resources'
            ]
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/' }
    maven { url = 'https://maven.nucleoid.xyz/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVer}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVer}"

    modApi("me.shedaniel.cloth:cloth-config-fabric:${clothVer}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modImplementation("com.terraformersmc:modmenu:${modmenuVer}")

    if (placeholderApiVer) {
        modCompileOnly "eu.pb4:placeholder-api:${placeholderApiVer}"
    }

    // Compiled from source into this jar, not carried inside it. The mod
    // ships no nested anything -- which is also how 'main' builds, and why
    // HelpSystem looked missing here: it was inside META-INF/jars.
    compileOnly project(path: ':common', configuration: 'namedElements')
}

def minecraftRange = project.findProperty("mc_range_fabric_${vKey}")
if (minecraftRange == null) {
    throw new GradleException("Missing property 'mc_range_fabric_${vKey}' in gradle.properties (required to declare the supported Minecraft range in fabric.mod.json)")
}

processResources {
    inputs.property "version", mod_version
    inputs.property "minecraft_range", minecraftRange
    filesMatching("fabric.mod.json") {
        expand "version": mod_version, "minecraft_range": minecraftRange
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('processClientResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.withType(Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

java {
}
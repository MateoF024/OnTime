plugins {
    id 'java-library'
    // See common/build.gradle for why both Loom variants are declared.
    id 'net.fabricmc.fabric-loom-remap' version '1.17.13' apply false
    id 'net.fabricmc.fabric-loom' version '1.17.13' apply false
}

apply plugin: (rootProject.ext.unobfuscatedMc ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap')

def minecraftVer = project.minecraft_version
// Family resolution lives in the root build.gradle (single source of truth).
def versionType = rootProject.ext.versionType
def vKey = rootProject.ext.vKey
def requireFamilyProperty = rootProject.ext.requireFamilyProperty

def fabricApiVer      = requireFamilyProperty("fabric_api_${vKey}")
def placeholderApiVer = project.findProperty("placeholder_api_${vKey}")
def minecraftRange    = requireFamilyProperty("mc_range_fabric_${vKey}")

base {
    archivesName = "${project.archives_base_name}+fabric+${minecraftVer}"
}

version = project.mod_version
group = project.maven_group

loom {
    splitEnvironmentSourceSets()

    mods {
        ontime {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

sourceSets {
    main {
        java {
            // src/<fabricVer> holds the Fabric-side platform glue (networking,
            // triggers, PlaceholderAPI). It is grouped by Fabric/PAPI tier, not
            // by family — see the root build.gradle for the mapping.
            srcDirs = [
                    'src/main/java',
                    '../common/src/main/java',
                    "../common/src/${rootProject.ext.helpSystemVer}/java",
                    "../common/src/${rootProject.ext.compatVer}/java",
                    "src/${rootProject.ext.fabricVer}/java"
            ]
        }
        resources {
            srcDirs = [
                    "src/${versionType}/main/resources",
                    'src/main/resources',
                    '../common/src/main/resources'

            ]
        }
    }

    client {
        java {
            // Client code shared with NeoForge lives under common/src/: the
            // loader axis is redundant there (TitleOverlay was byte-identical
            // between loaders in all six families). It still compiles once per
            // family and per loader — only the duplicated *sources* are gone.
            //   common/src/client        shared by every family
            //   common/src/<clientVer>   TimerRenderer + TitleOverlay flavour
            //   common/src/<screenVer>   AdminScreen: input signatures + drawing
            //   common/src/client-pre26  GuiGraphics era (ITimerRenderer, boss bar mixin)
            //   common/src/client-26     GuiGraphicsExtractor era (26.1+)
            // src/client-pre26 and src/client-26 keep the Fabric-only entrypoint.
            srcDirs = [
                    'src/client/java',
                    '../common/src/client/java',
                    "../common/src/${rootProject.ext.clientVer}/java",
                    "../common/src/${rootProject.ext.screenVer}/java",
                    // VanillaClientCompat sits in its own client dir so the
                    // dedicated-server source set never sees client types.
                    "../common/src/${rootProject.ext.compatVer}/client/java",
                    "src/${versionType}/client/java"
            ] + (rootProject.ext.unobfuscatedMc
                    ? ['../common/src/client-26/java', 'src/client-26/java']
                    : ['../common/src/client-pre26/java', 'src/client-pre26/java'])
        }
        resources {
            srcDirs = [
                    "src/${versionType}/client/resources",
                    'src/client/resources',
                    '../common/src/client/resources'
            ]
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVer}"

    if (!rootProject.ext.unobfuscatedMc) {
        mappings loom.officialMojangMappings()

        modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVer}"
        if (placeholderApiVer) {
            modCompileOnly "eu.pb4:placeholder-api:${placeholderApiVer}"
        }
    } else {
        // The non-remapping plugin (26.1+) drops the mod* configurations and
        // 'namedElements'; mods are plain dependencies (see
        // FabricMC/fabric-example-mod, branch 26.1).
        implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVer}"
        if (placeholderApiVer) {
            compileOnly "eu.pb4:placeholder-api:${placeholderApiVer}"
        }
    }

    // The common sources are compiled straight into this jar (see the source
    // set above), exactly as the NeoForge subproject does. They used to ALSO be
    // bundled as a nested jar, so every Fabric artifact carried the whole of
    // common twice — 466 KB against NeoForge's 262 KB for the same code.
}

// The mixin configs used to be copied per family just to carry a different
// compatibilityLevel; it is expanded from the family's Java release instead.
def mixinCompatLevel = rootProject.ext.javaRelease.toString()

processResources {
    def javaRequirement = ">=${rootProject.ext.javaRelease}".toString()
    // The version this family was built against, and no ceiling: Fabric API
    // keeps releasing for a given game version, and the minecraft range
    // already closes the interval. A ceiling here would only break the mod
    // on the next API release. It used to be "*", which asked for nothing at
    // all from a mod that carries three different Fabric API source sets.
    def fabricApiRequirement = ">=${fabricApiVer}".toString()
    inputs.property "version", mod_version
    inputs.property "minecraft_range", minecraftRange
    inputs.property "java_requirement", javaRequirement
    inputs.property "fabric_api_requirement", fabricApiRequirement
    inputs.property "mixin_compat_level", mixinCompatLevel
    filesMatching("fabric.mod.json") {
        expand "version": mod_version, "minecraft_range": minecraftRange,
                "java_requirement": javaRequirement,
                "fabric_api_requirement": fabricApiRequirement
    }
    filesMatching("ontime*.mixins.json") {
        expand "mixin_compat_level": mixinCompatLevel
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('processClientResources') {
    inputs.property "mixin_compat_level", mixinCompatLevel
    filesMatching("ontime*.mixins.json") {
        expand "mixin_compat_level": mixinCompatLevel
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.withType(Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Sanity check: the final jar must declare the version from gradle.properties
// and the exact Minecraft range of its family. Guards against the 3.0.0
// incident where a jar shipped with stale hand-maintained metadata.
// Under the non-remapping plugin (26.1+) the final artifact comes from 'jar';
// under fabric-loom-remap it is 'remapJar'.
def finalJarTaskName = rootProject.ext.unobfuscatedMc ? 'jar' : 'remapJar'
def verifyLoaderMetadata = tasks.register('verifyLoaderMetadata') {
    dependsOn tasks.named(finalJarTaskName)
    def expectedVersion = project.mod_version
    def expectedRange = minecraftRange
    doLast {
        def jarFile = tasks.named(finalJarTaskName).get().archiveFile.get().asFile
        def fmj = new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            def entry = zip.getEntry('fabric.mod.json')
            if (entry == null) {
                throw new GradleException("verifyLoaderMetadata: fabric.mod.json missing from ${jarFile.name}")
            }
            new groovy.json.JsonSlurper().parse(zip.getInputStream(entry))
        }
        if (fmj.version != expectedVersion) {
            throw new GradleException("verifyLoaderMetadata: ${jarFile.name} declares version '${fmj.version}', expected '${expectedVersion}'")
        }
        if (fmj.depends.minecraft != expectedRange) {
            throw new GradleException("verifyLoaderMetadata: ${jarFile.name} declares minecraft '${fmj.depends.minecraft}', expected '${expectedRange}'")
        }
    }
}
tasks.named('check') { dependsOn verifyLoaderMetadata }

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(rootProject.ext.javaRelease)
    }
}

// Modrinth and CurseForge release tasks (never part of 'build').
apply from: rootProject.file('publish.gradle')

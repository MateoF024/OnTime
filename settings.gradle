pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'ontime'

// This branch is 1.20.1 and nothing else. The other families are built from
// 'main', which has its own seven of them; the fork that used to be here chose
// between legacyforge and a NeoForge module that no build on this branch ever
// compiled.
include('common')
include('fabric')
include('legacyforge')
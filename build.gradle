plugins {
    id 'java'
}

jar.enabled = false

subprojects {
    apply plugin: 'java'

    group = project.maven_group
    version = project.mod_version

    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        maven { url = 'https://maven.shedaniel.me/' }
        maven { url = 'https://maven.terraformersmc.com/releases/' }
        maven { url = 'https://maven.nucleoid.xyz/' }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'

        options.release = 17
     }
    afterEvaluate {
        // Final jars are classified by loader, matching main:
        // build/libs/fabric/ and build/libs/forge/ ('legacyforge'
        // builds the Forge 1.20.1 jar).
        // legacyforge builds the Forge 1.20.1 jar, and it lands in libs/forge
        // so the two loaders read the way they do on 'main'.
        def loaderDir = (project.name == 'legacyforge') ? 'forge' : project.name
        tasks.withType(AbstractArchiveTask).configureEach {
            if (project.name != 'common'
                    && !name.toLowerCase().contains('source')
                    && !archiveClassifier.getOrElse('').toLowerCase().contains('dev')) {
                destinationDirectory = rootProject.layout.buildDirectory.dir("libs/${loaderDir}")
            }
        }
    }
    }
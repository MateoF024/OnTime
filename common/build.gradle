plugins {
    id 'java-library'
    id 'fabric-loom' version '1.13-SNAPSHOT'
}

def minecraftVer = project.minecraft_version

// One family on this branch, so one answer each. Java 17 is what 1.20.1
// runs on, and it is also the ceiling for what can be written here: 'main'
// compiles at 21 but deliberately uses nothing that needs it.
String versionType = "v1.20.1"
def helpSystemVer = "v1"
def javaVer = 17

base {
    archivesName = "${project.archives_base_name}-common"
}

sourceSets {
    main {
        java {
            srcDirs = [
                    'src/main/java',
                    "src/${helpSystemVer}/java"
            ]
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVer}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    compileOnly 'com.google.code.gson:gson:2.10.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVer)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
org.gradle.configuration-cache=false

mod_version=5.0.0
mod_id=ontime
mod_name=OnTime
maven_group=com.mateof24
archives_base_name=ontime
#======== VERSION SCHEMA ======================
# One family, two loaders, two jars:
#   Fabric 1.20.1  |  LegacyForge 1.20.1
# Everything from 1.21.1 up is built from 'main'.
minecraft_version=1.20.1
# =============================================

# =============================================
#   SUPPORTED MINECRAFT RANGES (per family)
#   Expanded into fabric.mod.json / mods.toml by processResources.
#   Closed on both sides, like every range on 'main'.
# =============================================
mc_range_fabric_v1_20_1=>=1.20.1 <1.20.2
mc_range_forge_v1_20_1=[1.20.1,1.20.2)
# The Forge loader itself, with a floor and no ceiling: Forge keeps
# releasing 47.x for 1.20.1, and the game range above already closes the
# interval. A ceiling would break the mod on the next Forge build.
forge_range=[47,)

# =============================================
#   DEPENDENCY AND LOADERS
# =============================================

# Mappings
mapping_channel=official

# Fabric Loader and Fabric API
fabric_loader_version=0.19.3
fabric_api_v1_20_1=0.92.9+1.20.1

# LegacyForge
forge_version=47.4.10
forge_mc_version=1.20.1
forge_mapping_version=1.20.1

# Cloth Config (Fabric and NeoForge)
# Placeholder API (Fabric)
placeholder_api_v1_20_1=2.1.4+1.20.1

# =============================================
#   PUBLISHING
#   The range above is what the loader enforces; this is the same thing
#   spelled out, because the platforms want a list rather than an interval.
#   publishCheck fails the build if the two disagree.
# =============================================
publish_versions_v1_20_1=1.20.1

# The same two projects as main -- both branches publish to one listing.
# Not secrets; the tokens live outside the repository.
modrinth_project_id=
curseforge_project_id=
